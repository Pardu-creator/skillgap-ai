name: 🚀 SkillGap AI — Build APK + Deploy Website

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────
  # JOB 1: Build & Sign Android APK
  # ─────────────────────────────────────────────────
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Grant Gradle execute permission
        run: chmod +x project1-main/android-app/gradlew

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Set up Keystore
        run: |
          mkdir -p project1-main/android-app/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > project1-main/android-app/app/release.jks
            echo "✅ Keystore restored from secret"
          elif [ ! -f "project1-main/android-app/app/release.jks" ]; then
            keytool -genkeypair -v -keystore project1-main/android-app/app/release.jks \
              -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass password123 -keypass password123 \
              -dname "CN=SkillGapAI, OU=Engineering, O=SkillGap, L=San Francisco, ST=CA, C=US"
            echo "✅ Auto-generated release signing keystore"
          fi

      - name: 🏗️ Build APK
        working-directory: project1-main/android-app
        run: |
          ./gradlew assembleRelease --no-daemon -PGEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" || \
          ./gradlew assembleDebug --no-daemon -PGEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: 📋 List built APKs
        run: find project1-main/android-app -name "*.apk" -type f

      - name: 🏷️ Package APK
        run: |
          mkdir -p artifacts
          REL_APK=$(find project1-main/android-app -name "*release*.apk" | head -n 1)
          DBG_APK=$(find project1-main/android-app -name "*debug*.apk" | head -n 1)
          SRC_APK="${REL_APK:-$DBG_APK}"
          if [ -n "$SRC_APK" ] && [ -f "$SRC_APK" ]; then
            cp "$SRC_APK" artifacts/SkillGapAI-v${{ github.run_number }}.apk
            cp "$SRC_APK" artifacts/SkillGapAI-latest.apk
            echo "✅ Packaged APK from: $SRC_APK"
          else
            echo "❌ No built APK found, searching anywhere in workspace..."
            FALLBACK_APK=$(find . -name "*.apk" | head -n 1)
            if [ -n "$FALLBACK_APK" ]; then
              cp "$FALLBACK_APK" artifacts/SkillGapAI-v${{ github.run_number }}.apk
              cp "$FALLBACK_APK" artifacts/SkillGapAI-latest.apk
              echo "✅ Fallback to pre-existing APK: $FALLBACK_APK"
            else
              echo "❌ No APK available"
              exit 1
            fi
          fi

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillGapAI-APK
          path: artifacts/*.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release (on push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SkillGap AI v1.0.${{ github.run_number }}"
          body: |
            ## 📱 SkillGap AI Android App

            ### What's included:
            - ✅ Skill gap analyzer with Gemini 2.0 AI
            - 🗺️ Personalized 12-week career roadmap
            - 💬 AI career mentor chat
            - 🎨 Native Material Design 3 UI

            ### Install:
            1. Download `SkillGapAI-latest.apk` below
            2. Enable **Unknown Sources** in Android Settings
            3. Tap the APK to install
            4. Requires Android 7.0+ (API 24)

            ### Built from commit: ${{ github.sha }}
          files: |
            artifacts/SkillGapAI-latest.apk
            artifacts/SkillGapAI-v${{ github.run_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────
  # JOB 2: Deploy Website to GitHub Pages
  # ─────────────────────────────────────────────────
  deploy-website:
    name: 🌐 Deploy Website
    runs-on: ubuntu-latest
    needs: [ build-android ]
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Built APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: SkillGapAI-APK
          path: artifacts

      - name: 🔍 Detect website files
        id: detect
        run: |
          if [ -f "index.html" ]; then
            echo "SITE_ROOT=." >> $GITHUB_OUTPUT
          elif [ -f "project1-main/index.html" ]; then
            echo "SITE_ROOT=project1-main" >> $GITHUB_OUTPUT
          else
            echo "SITE_ROOT=." >> $GITHUB_OUTPUT
          fi

      - name: 📂 Prepare site directory
        run: |
          mkdir -p _site
          SITE_ROOT=${{ steps.detect.outputs.SITE_ROOT }}
          cp "$SITE_ROOT/index.html" _site/
          [ -f "$SITE_ROOT/style.css" ] && cp "$SITE_ROOT/style.css" _site/ || true
          [ -f "$SITE_ROOT/app.js" ] && cp "$SITE_ROOT/app.js" _site/ || true
          # Copy api folder if present
          [ -d "$SITE_ROOT/api" ] && cp -r "$SITE_ROOT/api" _site/ || true
          # Copy APK so download button works on live website
          if [ -f "artifacts/SkillGapAI-latest.apk" ]; then
            cp artifacts/SkillGapAI-latest.apk _site/SkillGapAI.apk
          elif [ -f "SkillGapAI.apk" ]; then
            cp SkillGapAI.apk _site/SkillGapAI.apk
          elif [ -f "project1-main/SkillGapAI.apk" ]; then
            cp project1-main/SkillGapAI.apk _site/SkillGapAI.apk
          fi
          echo "✅ Site prepared:"
          ls -la _site/

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: '_site'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  # ─────────────────────────────────────────────────
  # JOB 3: Notify summary
  # ─────────────────────────────────────────────────
  notify:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [ build-android, deploy-website ]
    if: always()

    steps:
      - name: ✅ Print Summary
        run: |
          echo "## 🚀 SkillGap AI CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Android APK Build | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Website Deploy | ${{ needs.deploy-website.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Run #:** \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
