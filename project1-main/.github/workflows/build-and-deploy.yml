name: 🚀 SkillGap AI — Build APK + Deploy Website

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────
  # JOB 1: Build & Sign Android APK
  # ─────────────────────────────────────────────────
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Grant Gradle execute permission
        run: chmod +x project1-main/android-app/gradlew

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🏗️ Build Release APK
        working-directory: project1-main/android-app
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: 📋 List built APKs
        run: find project1-main/android-app -name "*.apk" -type f

      - name: 🏷️ Rename APK
        run: |
          mkdir -p artifacts
          cp project1-main/android-app/app/build/outputs/apk/release/app-release.apk artifacts/SkillGapAI-v${{ github.run_number }}.apk
          cp project1-main/android-app/app/build/outputs/apk/release/app-release.apk artifacts/SkillGapAI-latest.apk

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillGapAI-APK-v${{ github.run_number }}
          path: artifacts/*.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release (on push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SkillGap AI v1.0.${{ github.run_number }}"
          body: |
            ## 📱 SkillGap AI Android App

            ### What's included:
            - ✅ Skill gap analyzer with Gemini 2.0 AI
            - 🗺️ Personalized 12-week career roadmap
            - 💬 AI career mentor chat
            - 🎨 Native Material Design 3 UI

            ### Install:
            1. Download `SkillGapAI-latest.apk` below
            2. Enable **Unknown Sources** in Android Settings
            3. Tap the APK to install
            4. Requires Android 7.0+ (API 24)

            ### Built from commit: ${{ github.sha }}
          files: |
            artifacts/SkillGapAI-latest.apk
            artifacts/SkillGapAI-v${{ github.run_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────
  # JOB 2: Deploy Website to GitHub Pages
  # ─────────────────────────────────────────────────
  deploy-website:
    name: 🌐 Deploy Website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Detect website files
        id: detect
        run: |
          if [ -f "index.html" ]; then
            echo "SITE_ROOT=." >> $GITHUB_OUTPUT
          elif [ -f "project1-main/index.html" ]; then
            echo "SITE_ROOT=project1-main" >> $GITHUB_OUTPUT
          else
            echo "SITE_ROOT=." >> $GITHUB_OUTPUT
          fi

      - name: 📂 Prepare site directory
        run: |
          mkdir -p _site
          SITE_ROOT=${{ steps.detect.outputs.SITE_ROOT }}
          cp "$SITE_ROOT/index.html" _site/
          [ -f "$SITE_ROOT/style.css" ] && cp "$SITE_ROOT/style.css" _site/ || true
          [ -f "$SITE_ROOT/app.js" ] && cp "$SITE_ROOT/app.js" _site/ || true
          # Copy api folder if present
          [ -d "$SITE_ROOT/api" ] && cp -r "$SITE_ROOT/api" _site/ || true
          echo "✅ Site prepared:"
          ls -la _site/

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────────
  # JOB 3: Notify summary
  # ─────────────────────────────────────────────────
  notify:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [ build-android, deploy-website ]
    if: always()

    steps:
      - name: ✅ Print Summary
        run: |
          echo "## 🚀 SkillGap AI CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Android APK Build | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Website Deploy | ${{ needs.deploy-website.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Run #:** \`${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
